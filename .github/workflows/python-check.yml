name: Python Check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile software/acquisition/create_test.py
      - run: python -m py_compile software/feature_extraction/extract_features.py
      - run: python -m py_compile software/machine_learning/train_model.py
      - run: python -m py_compile software/machine_learning/predict.py
